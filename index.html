<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Badminton Pro Score - Fullscreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="randomPage">
        <div class="card">
            <h2 class="title">🏸 โจ๋เรนเจอร์</h2>
            <textarea id="playerInput" placeholder="ใส่ชื่อคนละบรรทัด..."></textarea>
            <button class="btn-outline" onclick="load8Players()">🧪 ใช้ตัวอย่าง 8 คน</button>
            <button class="btn-green" style="margin-top:20px" onclick="startRandom()">เริ่มสุ่มคู่แรก</button>
            <button class="btn-purple" onclick="nextMatch()">สุ่มรอบถัดไป</button>
            <button class="btn-reset" onclick="resetAll()">🔄 รีเซ็ตทั้งหมด</button>
        </div>

        <div id="matchCard" class="card" style="display:none">
            <div id="roundCount" class="round-text">แมตช์ที่ 1</div>
            <div class="match-display">
                <div class="red-side"><div id="p1" class="name-tag">-</div><div id="p2" class="name-tag">-</div></div>
                <div class="vs-text">VS</div>
                <div class="blue-side"><div id="p3" class="name-tag">-</div><div id="p4" class="name-tag">-</div></div>
            </div>
            <button class="btn-score-nav" onclick="openScoreboard()">⚔️ ไปหน้านับคะแนน</button>
            <div id="playerStats" class="stats"></div>
        </div>
    </div>

    <div id="scorePage" style="display:none;">
        <div class="full-score-container">
            <div class="score-half red-team" onclick="handleScoreClick(event, 1)">
                <div id="namesTeam1" class="player-names-overlay"></div>
                <div id="s1" class="score-huge">0</div>
                <div class="tap-hint">ลดแต้ม 👈 | เพิ่มแต้ม 👉</div>
            </div>
            
            <div class="score-half blue-team" onclick="handleScoreClick(event, 2)">
                <div id="namesTeam2" class="player-names-overlay"></div>
                <div id="s2" class="score-huge">0</div>
                <div class="tap-hint">ลดแต้ม 👈 | เพิ่มแต้ม 👉</div>
            </div>
            <button class="btn-floating-back" onclick="backToRandom()">✕</button>
        </div>
    </div>
</div>

<div id="endModal" class="modal">
    <div class="modal-content">
        <h1 id="winnerTitle">จบเกม!</h1>
        <p>คะแนนถึงเกณฑ์ตัดสินแล้ว</p>
        <button class="btn-purple" onclick="closeModal()">นับต่อ (Deuce)</button>
        <button class="btn-green" onclick="endGame()">จบเกม (สุ่มคู่ใหม่)</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
